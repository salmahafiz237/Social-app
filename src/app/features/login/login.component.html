<div class="min-h-screen bg-[#f0f2f5] px-4 py-8 sm:py-12 lg:flex lg:items-center"
    style="font-family: Cairo, sans-serif;">
    <div
        class="mx-auto flex w-full max-w-6xl flex-col items-center gap-6 sm:gap-8 lg:flex-row lg:items-center lg:justify-between">
        
        <app-left-side></app-left-side>

        <section class="order-1 w-full max-w-107.5 lg:order-2">
            <div class="rounded-2xl bg-white p-4 sm:p-6">
                <div class="mb-4 text-center lg:hidden">
                    <h1 class="text-3xl font-extrabold tracking-tight text-[#00298d]">Route Posts</h1>
                    <p class="mt-1 text-base font-medium leading-snug text-slate-700">Connect with friends and the world
                        around you on Route Posts.</p>
                </div>
                <div class="mb-5 grid grid-cols-2 rounded-xl bg-slate-100 p-1">
                    <button routerLink="/login" type="button"
                        class="rounded-lg py-2 text-sm font-extrabold transition bg-white text-[#00298d] shadow-sm">Login</button>
                        <button routerLink="/register"
                        type="button"
                        class="rounded-lg py-2 text-sm font-extrabold transition text-slate-600 hover:text-slate-800">Register</button>
                </div>
                <h2 class="text-2xl font-extrabold text-slate-900">Log in to Route Posts</h2>
                <p class="mt-1 text-sm text-slate-500">Log in and continue your social journey.</p>
                <form novalidate="" class="mt-5 space-y-3.5">
                    <div>
                        <div class="relative"><span
                                class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"><svg
                                    xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round" class="lucide lucide-user" aria-hidden="true">
                                    <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
                                    <circle cx="12" cy="7" r="4"></circle>
                                </svg></span><input placeholder="Email or username"
                                class="w-full rounded-xl border bg-slate-50 py-3 pl-11 pr-4 text-sm text-slate-800 outline-none transition focus:bg-white border-slate-200 focus:border-[#00298d]"
                                type="text" name="login"></div>
                    </div>
                    <div>
                        <div class="relative"><span
                                class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"><svg
                                    xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round" class="lucide lucide-key-round" aria-hidden="true">
                                    <path
                                        d="M2.586 17.414A2 2 0 0 0 2 18.828V21a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h1a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h.172a2 2 0 0 0 1.414-.586l.814-.814a6.5 6.5 0 1 0-4-4z">
                                    </path>
                                    <circle cx="16.5" cy="7.5" r=".5" fill="currentColor"></circle>
                                </svg></span><input placeholder="Password"
                                class="w-full rounded-xl border bg-slate-50 py-3 pl-11 pr-4 text-sm text-slate-800 outline-none transition focus:bg-white border-slate-200 focus:border-[#00298d]"
                                type="password" name="password"></div>
                    </div><button
                        class="w-full rounded-xl py-3 text-base font-extrabold text-white transition disabled:opacity-60 bg-[#00298d] hover:bg-[#001f6b]">Log
                        In</button><button type="button"
                        class="cursor-pointer mx-auto block text-sm font-semibold text-[#00298d] transition hover:underline">Forgot
                        password?</button>
                </form>
            </div>
        </section>
    </div>
</div>
